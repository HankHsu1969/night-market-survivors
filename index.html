<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>夜市倖存者</title>
<link rel="preload" as="image" href="assets/cover.jpg" media="(max-aspect-ratio: 1/1)">
<link rel="preload" as="image" href="assets/title.jpg" media="(min-aspect-ratio: 1/1)">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Huninn&family=Noto+Sans+TC:wght@900&display=swap">
<style>
/* Layout: one full-bleed night-market street (canvas). The HUD is pinned to the top edge;
   screens hang over the street as a lit signboard and fluorescent-paper price cards. */
:root{
  --night:#15122a; --asphalt:#1c1836; --ink:#1a1320; --paper:#fff4dc;
  --sign-red:#e23b2e; --sign-red-deep:#8e1c14; --bulb:#ffcf4a; --xp:#45e0c0;
  --fluo-yellow:#f4f03a; --fluo-pink:#ff86bd; --fluo-green:#86f58f;
  --scrim:rgba(15,12,34,.93); --panel:rgba(21,18,42,.72); --line:rgba(255,244,220,.3);
  --font-sign:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-num:"Bungee","Noto Sans TC","PingFang TC",sans-serif;
  --art:url("assets/cover.jpg");
  color-scheme:dark;
}
@media (min-aspect-ratio:1/1){:root{--art:url("assets/title.jpg")}}
@property --spin{syntax:'<angle>';inherits:false;initial-value:0deg}
html{box-sizing:border-box;height:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{height:100%;margin:0;background:var(--night);color:var(--paper);font-family:var(--font-body);
  font-size:16px;line-height:1.5;overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--paper);outline-offset:3px}

#game{position:relative;height:100%;overflow:hidden;background:var(--asphalt)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette,.hurt{position:absolute;inset:0;pointer-events:none}
.vignette{background:radial-gradient(ellipse at center,transparent 45%,rgba(8,6,20,.62) 100%)}
.hurt{opacity:0;background:radial-gradient(ellipse at center,transparent 38%,rgba(226,59,46,.62) 100%)}

/* HUD */
#hud{position:absolute;inset:0 0 auto 0;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.xp{height:10px;background:rgba(255,244,220,.14)}
.xp i{display:block;height:100%;background:var(--xp);transform-origin:left center;transform:scaleX(0);transition:transform .15s linear}
.hudrow{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding-inline:16px}
.hudleft{display:flex;flex-direction:column;font-size:.9rem;line-height:1.3;text-shadow:0 1px 0 var(--ink),0 0 6px var(--ink)}
.hudleft b,.money b{font-family:var(--font-num);font-weight:400;font-variant-numeric:tabular-nums}
.money{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.money small{font-size:.72rem;letter-spacing:.08em;opacity:.85;text-shadow:0 0 6px var(--ink)}
.money b{font-size:1.45rem;color:var(--bulb);text-shadow:2px 2px 0 var(--ink);white-space:nowrap}
.money b span{font-size:.7em;margin-right:2px}
.hudbtn{justify-self:end;pointer-events:auto;min-width:56px;min-height:44px;padding:0 12px;cursor:pointer;
  border:2px solid rgba(255,244,220,.55);background:var(--panel);border-radius:6px;font-size:.9rem}
.hudsub{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding-inline:16px}
.build{display:flex;flex-wrap:wrap;gap:6px}
.build span{display:flex;align-items:center;gap:3px;font-size:.8rem;padding:1px 9px 1px 4px;background:var(--panel);border:1px solid var(--line);border-radius:99px}
.build img{width:20px;height:20px;object-fit:contain}
.quests{margin:0;padding:6px 10px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  font-size:.82rem;line-height:1.5;width:min(250px,100%)}
.quests li{display:flex;gap:10px;justify-content:space-between;align-items:baseline}
.quests li b{font:400 .76rem/1.5 var(--font-num);color:var(--bulb);white-space:nowrap}
.quests li.done{color:var(--fluo-green)}
.quests li.done b{color:var(--fluo-green)}
.quests .qh{font-weight:900;color:var(--bulb);letter-spacing:.06em}
#toast{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);
  background:var(--sign-red);color:var(--paper);font:900 1.05rem/1.3 var(--font-sign);padding:8px 16px;
  border:2px solid var(--paper);pointer-events:none;text-align:center}
.lvbanner{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  width:max-content;max-width:calc(100% - 32px);padding:8px 16px 8px 8px;background:var(--fluo-yellow);color:var(--ink);
  box-shadow:4px 4px 0 var(--sign-red);pointer-events:none}
.lvbanner img{width:48px;height:48px;object-fit:contain;flex:none}
.lvbanner b{display:block;font:900 1.05rem/1.25 var(--font-sign)}
.lvbanner span{display:block;font-size:.92rem;line-height:1.3}
.bossbar{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(340px,calc(100% - 32px));pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:3px;font:900 .95rem/1.2 var(--font-sign);text-shadow:0 1px 0 var(--ink),0 0 6px var(--ink)}
.bossbar b{display:block;width:100%;height:12px;background:rgba(0,0,0,.55);border:2px solid var(--paper);border-radius:99px;overflow:hidden}
.bossbar i{display:block;height:100%;background:var(--sign-red);transform-origin:left center}

/* Cover (loading) */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:max(28px,6vh) 16px max(32px,6vh);background:var(--night) var(--art) center/cover no-repeat;cursor:pointer}
.cover::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(15,12,34,.5) 0,rgba(15,12,34,0) 34%,rgba(15,12,34,0) 64%,rgba(15,12,34,.88) 100%)}
.cover>*{position:relative}
.coverfoot{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.loadbar{width:min(320px,80%);height:12px;border:2px solid var(--paper);border-radius:99px;background:rgba(0,0,0,.45);overflow:hidden}
.loadbar i{display:block;height:100%;background:var(--bulb);transform-origin:left center;transform:scaleX(0);transition:transform .2s}
.tapgo{cursor:pointer;background:none;border:0;min-height:48px;padding:0 16px;font:900 1.5rem/1.2 var(--font-sign);letter-spacing:.1em;
  color:var(--fluo-yellow);text-shadow:3px 3px 0 var(--sign-red-deep),0 0 18px rgba(255,207,74,.6)}
.tapgo:disabled{cursor:default;color:var(--paper);font-size:1.05rem;text-shadow:0 1px 0 var(--ink),0 0 8px var(--ink)}

/* Screens */
.scr{position:absolute;inset:0;display:flex;overflow-y:auto;padding-block:24px;padding-inline:16px;
  background:radial-gradient(ellipse at center,rgba(15,12,34,.93) 0 55%,rgba(15,12,34,.62) 100%)}
#scrStart{background:linear-gradient(rgba(15,12,34,.7),var(--scrim)),var(--night) var(--art) center/cover no-repeat}
.box{margin:auto;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.box.wide{max-width:880px}
.marquee{position:relative;padding:20px;background:#2b0f2a;border-radius:10px;max-width:100%}
.marquee::before{content:"";position:absolute;inset:0;border-radius:inherit;
  background:radial-gradient(circle,var(--bulb) 0 3.5px,rgba(255,207,74,.28) 4px 6px,transparent 6.5px) 0 0/20px 20px round;
  -webkit-mask-image:repeating-conic-gradient(from var(--spin),#000 0 30deg,rgba(0,0,0,.28) 30deg 60deg);
  mask-image:repeating-conic-gradient(from var(--spin),#000 0 30deg,rgba(0,0,0,.28) 30deg 60deg)}
.sign{position:relative;background:var(--sign-red);border:2px solid var(--paper);padding:12px 22px 16px}
.sign.solo{padding:10px 26px 12px;box-shadow:5px 5px 0 var(--sign-red-deep)}
.kicker{margin:0 0 2px;font:400 clamp(.6rem,2.9vw,.85rem)/1.4 var(--font-num);letter-spacing:.08em;color:var(--bulb)}
h1,h2{margin:0;font-family:var(--font-sign);font-weight:900;text-wrap:balance}
h1{font-size:clamp(2.4rem,12vw,4.4rem);line-height:1.1;letter-spacing:.04em;white-space:nowrap;text-shadow:3px 3px 0 var(--sign-red-deep)}
.sign h2{font-size:clamp(1.8rem,8vw,2.6rem);line-height:1.2;text-shadow:3px 3px 0 var(--sign-red-deep)}
.lead{margin:0;font-size:1.12rem;max-width:22em;text-wrap:balance}
.howto{margin:0;padding:0;list-style:none;display:grid;gap:6px;text-align:left;font-size:1rem;max-width:24em}
.howto li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
.howto li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--bulb);box-shadow:0 0 8px var(--bulb);transform:translateY(-1px)}
.go{cursor:pointer;border:0;min-height:56px;padding:14px 34px;background:var(--fluo-yellow);color:var(--ink);
  font:900 1.5rem/1 var(--font-sign);letter-spacing:.06em;transform:rotate(-1.5deg);box-shadow:5px 5px 0 var(--sign-red)}
.go:active{transform:rotate(-1.5deg) translate(3px,3px);box-shadow:2px 2px 0 var(--sign-red)}
.textbtn{cursor:pointer;background:none;border:0;min-height:44px;padding:0 12px;text-decoration:underline;text-underline-offset:4px;font-size:1rem}
.best{margin:0;font-size:1rem;color:var(--bulb)}
.stats b{font-family:var(--font-num);font-weight:400;font-variant-numeric:tabular-nums;color:var(--bulb)}
.row{display:flex;flex-wrap:wrap;gap:8px 20px;justify-content:center;align-items:center}
.pick{margin:0;font:900 1.25rem/1.3 var(--font-sign);color:var(--bulb);text-shadow:2px 2px 0 var(--ink)}

/* Cards: fluorescent paper price signs (stage list and upgrade choices) */
.lvtitle{font-size:clamp(1.5rem,6.5vw,2rem);color:var(--bulb);text-shadow:3px 3px 0 var(--ink)}
.cards{display:grid;gap:16px;width:100%;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
/* Stage list: one lit signboard per street */
.stages{display:grid;gap:18px;width:100%;grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr))}
.stage{position:relative;cursor:pointer;display:flex;flex-direction:column;padding:0;border:3px solid var(--paper);border-radius:14px;overflow:hidden;
  background:var(--ink);color:var(--paper);text-align:left;box-shadow:0 6px 0 var(--sign-red-deep),0 12px 26px rgba(0,0,0,.45);transition:transform .15s ease}
.stage:not(:disabled):hover{transform:translateY(-4px)}
.stage:not(:disabled):active{transform:translateY(3px);box-shadow:0 3px 0 var(--sign-red-deep)}
.stage:disabled{cursor:not-allowed;border-color:var(--line);box-shadow:0 6px 0 rgba(0,0,0,.4)}
.sart{position:relative;display:block;aspect-ratio:16/8;background:var(--night) var(--thumb) center/cover no-repeat}
.sart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,12,34,0) 50%,rgba(15,12,34,.8) 100%)}
.stage:disabled .sart{filter:grayscale(1) brightness(.4)}
.snum{position:absolute;z-index:1;left:12px;top:10px;width:44px;height:54px;display:grid;place-items:center;border-radius:48% 48% 42% 42%;
  background:radial-gradient(circle at 40% 32%,#ff8a66,var(--sign-red) 58%,var(--sign-red-deep));border:2px solid var(--bulb);
  color:var(--bulb);font:400 1.45rem/1 var(--font-num);text-shadow:1px 1px 0 var(--ink);box-shadow:0 0 18px rgba(255,120,80,.65)}
.sface{position:absolute;z-index:1;right:4%;bottom:2%;height:94%;background:no-repeat 0 0/400% 100%;filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}
.sbadge{position:absolute;z-index:2;left:66px;top:12px;padding:2px 10px;font:900 .9rem/1.4 var(--font-sign);background:var(--ink);border:2px solid var(--paper);border-radius:4px}
.sbadge.done{background:var(--paper);color:var(--sign-red);border-color:var(--sign-red);transform:rotate(-6deg)}
.sinfo{display:flex;flex-direction:column;gap:4px;padding:10px 14px 14px}
.sinfo strong{font:900 1.3rem/1.25 var(--font-sign);color:var(--bulb)}
.sdesc{font-size:.95rem;line-height:1.4}
.smeta{display:flex;align-items:center;gap:6px;font-size:.88rem;color:var(--fluo-yellow)}
.smeta img{width:26px;height:26px;object-fit:contain}
.stage:disabled .sinfo{opacity:.55}
.card{--tilt:-1deg;cursor:pointer;border:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;
  min-height:84px;padding:14px 14px 14px 16px;text-align:left;background:var(--fluo-yellow);color:var(--ink);
  transform:rotate(var(--tilt));box-shadow:4px 5px 0 rgba(0,0,0,.5)}
.card:nth-child(2){--tilt:.8deg;background:var(--fluo-pink)}
.card:nth-child(3){--tilt:-.5deg;background:var(--fluo-green)}
.card:active{transform:rotate(var(--tilt)) translate(2px,3px);box-shadow:2px 2px 0 rgba(0,0,0,.5)}
.card:disabled{cursor:not-allowed;filter:grayscale(.9) brightness(.55)}
.card:disabled:active{transform:rotate(var(--tilt));box-shadow:4px 5px 0 rgba(0,0,0,.5)}
.stamp{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;transform:rotate(-8deg);
  background:var(--paper);border:3px solid var(--sign-red);color:var(--sign-red);font:900 26px/1 var(--font-sign)}
.stamp img{width:42px;height:42px;object-fit:contain;transform:rotate(8deg)}
.ctext{display:flex;flex-direction:column;gap:2px;min-width:0}
.ctext strong{font:900 1.25rem/1.2 var(--font-sign)}
.ctext span{font-size:1rem;line-height:1.35}
.tag{align-self:start;background:var(--ink);color:var(--paper);padding:3px 8px;font:400 .82rem/1.3 var(--font-num);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:420px}
.stats div{display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.7rem;line-height:1.1}
.stats span{font-size:.9rem}

@media (prefers-reduced-motion:no-preference){
  .marquee::before{animation:chase 2.6s linear infinite}
  .card{animation:pop .22s cubic-bezier(.2,1.4,.4,1) backwards}
  .card:nth-child(2){animation-delay:.05s}
  .card:nth-child(3){animation-delay:.1s}
  .stage{animation:pop .3s cubic-bezier(.2,1.4,.4,1) backwards}
  .stage:nth-child(2){animation-delay:.05s}
  .stage:nth-child(3){animation-delay:.1s}
  .stage:nth-child(4){animation-delay:.15s}
  .stage:nth-child(5){animation-delay:.2s}
  .tapgo:not(:disabled){animation:blink 1.2s ease-in-out infinite}
  .lvbanner.show{animation:slideup .25s cubic-bezier(.2,1.4,.4,1)}
}
@keyframes chase{to{--spin:360deg}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
@keyframes blink{50%{opacity:.4}}
@keyframes slideup{from{opacity:0;transform:translate(-50%,18px)}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv" aria-label="夜市倖存者遊戲畫面"></canvas>
  <div class="vignette"></div>
  <div class="hurt" id="hurt"></div>

  <div id="hud" hidden>
    <div class="xp" aria-hidden="true"><i id="xpfill"></i></div>
    <div class="hudrow">
      <div class="hudleft"><span>Lv <b id="lv">1</b></span><span>擊退 <b id="kills">0</b></span></div>
      <div class="money"><small>今晚營業額</small><b><span>NT$</span><em id="money" style="font-style:normal">0</em></b></div>
      <button class="hudbtn" id="btnPause" type="button">暫停</button>
    </div>
    <div class="hudsub">
      <ul class="quests" id="quests" aria-label="過關任務"></ul>
      <div class="build" id="build"></div>
    </div>
  </div>
  <div class="lvbanner" id="lvbanner" role="status" aria-live="polite" hidden>
    <img id="lvIcon" alt=""><div><b id="lvName"></b><span id="lvDesc"></span></div>
  </div>
  <div class="bossbar" id="bossbar" hidden><span id="bossname">夜市霸王</span><b><i id="bossfill"></i></b></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <section class="cover" id="scrCover">
    <div class="marquee"><div class="sign">
      <p class="kicker">NIGHT MARKET SURVIVORS</p>
      <h1>夜市倖存者</h1>
    </div></div>
    <div class="coverfoot">
      <div class="loadbar" aria-hidden="true"><i id="loadfill"></i></div>
      <button class="tapgo" id="btnCover" type="button" disabled>攤位準備中…</button>
    </div>
  </section>

  <section class="scr" id="scrStart" hidden>
    <div class="box wide">
      <div class="marquee"><div class="sign">
        <p class="kicker">NIGHT MARKET SURVIVORS</p>
        <h2>選一條街開始擺攤</h2>
      </div></div>
      <div class="stages" id="stageCards"></div>
      <ul class="howto">
        <li>按住畫面拖曳走位（電腦用方向鍵或 WASD）</li>
        <li>武器會自動攻擊，每一關主角帶的工具都不一樣</li>
        <li>撿百元鈔衝營業額，升級時自動變強</li>
        <li>完成這關的任務就能收攤，解鎖下一條街</li>
      </ul>
      <div class="row">
        <button class="textbtn" id="btnMode" type="button" aria-pressed="false">升級：自動挑</button>
        <button class="textbtn snd" id="btnSound1" type="button" aria-pressed="true">音效：開</button>
      </div>
    </div>
  </section>

  <section class="scr" id="scrLevel" hidden>
    <div class="box wide">
      <h2 class="lvtitle" id="lvTitle" tabindex="-1">升級了！選一樣</h2>
      <div class="cards" id="cards"></div>
    </div>
  </section>

  <section class="scr" id="scrPause" hidden>
    <div class="box">
      <div class="sign solo"><h2>休息一下</h2></div>
      <button class="go" id="btnResume" type="button">繼續擺攤</button>
      <div class="row">
        <button class="textbtn" id="btnRestart" type="button">重新開始</button>
        <button class="textbtn" id="btnMenu2" type="button">選擇關卡</button>
        <button class="textbtn snd" id="btnSound2" type="button" aria-pressed="true">音效：開</button>
      </div>
    </div>
  </section>

  <section class="scr" id="scrEnd" hidden>
    <div class="box">
      <div class="sign solo"><h2 id="endTitle">被吃垮了</h2></div>
      <p class="lead" id="endMsg"></p>
      <div class="stats">
        <div><b id="eTime">0:00</b><span>花了多久</span></div>
        <div><b id="eKills">0</b><span>擊退客人</span></div>
        <div><b id="eMoney">0</b><span>營業額</span></div>
      </div>
      <p class="best" id="eBest" hidden></p>
      <button class="go" id="btnGo" type="button">再擺一次</button>
      <div class="row">
        <button class="textbtn" id="btnAgain" type="button" hidden>再玩這關</button>
        <button class="textbtn" id="btnMenu" type="button">選擇關卡</button>
      </div>
    </div>
  </section>
</div>

<script>
(() => {
'use strict';
document.documentElement.lang = 'zh-Hant';

const TAU = Math.PI * 2;
const CELL = 72;            // spatial grid cell (>= largest pair of radii)
const TILE = 256;           // ground tile size in world units
const SLOTS = 3;            // how many different weapons you can carry
const C = { ground:'#1c1836', ink:'#1a1320', paper:'#fff4dc', red:'#e23b2e', bulb:'#ffcf4a', xp:'#45e0c0',
            hp:'#6fe07a', tofu:'#d8f06e', ice:'#9fe3ff', warn:'rgba(255,80,60,.5)', stick:'#c9a26b', shadow:'rgba(0,0,0,.36)' };
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const fmt = t => { t = Math.max(0, Math.floor(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };
const nt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const wan = n => n < 10000 ? nt(n) : (n / 10000).toFixed(1).replace(/\.0$/, '') + '萬';
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

const gameEl = $('game'), cv = $('cv'), ctx = cv.getContext('2d');
const el = {
  hud:$('hud'), xp:$('xpfill'), lv:$('lv'), kills:$('kills'), money:$('money'), build:$('build'), quests:$('quests'),
  hurt:$('hurt'), toast:$('toast'), banner:$('lvbanner'), bIcon:$('lvIcon'), bName:$('lvName'), bDesc:$('lvDesc'),

  const all = ART_ANIM.map(n => [n, 'webp']).concat(ART_PNG.map(n => [n, 'png']), ART_JPG.map(n => [n, 'jpg']));
  let done = 0;
  const load = Promise.all(all.map(([n, ext]) => new Promise(res => {
    const im = new Image(), fin = () => { done++; onStep(done / all.length); res(); };
    im.onload = () => { ART[n] = im; fin(); };

/* ---------- sprites (drawn once, blitted every frame) ---------- */
const SPR = {};
function sprite(w, h, draw) {
  const k = 3;
  const mk = withShadow => {
    const c = document.createElement('canvas'); c.width = Math.ceil(w * k); c.height = Math.ceil(h * k);
    const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.scale(k, k); g.translate(w / 2, h / 2); g.lineJoin = 'round'; g.lineCap = 'round';
    draw(g, withShadow); return c;

  const tint = col => { const c = mk(false), g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-in'; g.fillStyle = col; g.fillRect(0, 0, c.width, c.height); return c; };
  const sp = { img:mk(true), w, h, oy:0, ice:null };
  sp.flash = tint('#fff');
  sp.frost = () => sp.ice || (sp.ice = tint(C.ice));   // only made once something actually gets frozen
  return sp;
}
const dot = (g, x, y, r, fill) => { g.fillStyle = fill; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); };
const oval = (g, x, y, rx, ry, fill) => { g.fillStyle = fill; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); };

// A generated picture as a sprite, sized by its longest side and centred on the anchor.
function pic(im, size, shadowR, rot) {
  const s = size / Math.max(im.width, im.height), w = im.width * s, h = im.height * s, sr = shadowR || 0, pad = 3, box = rot ? Math.hypot(w, h) : 0;
  const W = Math.max(box || w, sr * 2) + pad * 2, H = (box || h) + pad * 2 + sr * 0.5;
  const top = -H / 2 + pad, bot = top + (box || h);
  const sp = sprite(W, H, (g, sh) => {
    if (sh && sr) oval(g, 0, bot - sr * 0.1, sr, sr * 0.3, C.shadow);
    if (rot) { g.save(); g.translate(0, (top + bot) / 2); g.rotate(rot); g.drawImage(im, -w / 2, -h / 2, w, h); g.restore(); }
    else g.drawImage(im, -w / 2, top, w, h);
  });
  sp.oy = -(top + bot) / 2;
  return sp;
}
// A walk cycle: n frames from one strip, `ht` units tall, feet `foot` units below the anchor.
function walk(im, n, ht, shadowR, foot) {
  const fw = im.width / n, w = fw * ht / im.height, sr = shadowR, pad = 3;
  const W = Math.max(w, sr * 2) + pad * 2, H = ht + pad * 2 + sr * 0.5, top = -H / 2 + pad, bot = top + ht, out = [];
  for (let i = 0; i < n; i++) {
    const sp = sprite(W, H, (g, sh) => {
      if (sh) oval(g, 0, bot - sr * 0.1, sr, sr * 0.3, C.shadow);
      g.drawImage(im, i * fw, 0, fw, im.height, -w / 2, top, w, ht);
    });
    sp.oy = foot - bot; out.push(sp);
  }
  return out;
}

function customer(d) {
  const r = d.r, size = Math.ceil(r * 2 + 10);
  return sprite(size, size, (g, sh) => {
    if (sh) oval(g, 0, r * 0.95, r * 0.85, r * 0.3, C.shadow);
    dot(g, 0, 0, r, d.col);
    g.lineWidth = 2; g.strokeStyle = C.ink; g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
    dot(g, -r * 0.3, -r * 0.2, r * 0.27, '#fff'); dot(g, r * 0.38, -r * 0.2, r * 0.27, '#fff');
    dot(g, -r * 0.2, -r * 0.17, r * 0.12, C.ink); dot(g, r * 0.48, -r * 0.17, r * 0.12, C.ink);
    oval(g, r * 0.08, r * 0.42, r * 0.4, r * 0.3, '#3b0d1a');
  });
}
function coinSprite(fill, edge, r) {
  return sprite(r * 2 + 6, r * 2 + 6, (g, sh) => {
    if (sh) oval(g, 0, r + 1, r * 0.8, 2.2, C.shadow);
    dot(g, 0, 0, r, fill);
    g.lineWidth = 1.6; g.strokeStyle = edge; g.beginPath(); g.arc(0, 0, r - 0.8, 0, TAU); g.stroke();

}
function glow(rgb, px, stops) {

function drawnTile() {   // 200 units of staggered paving, used when the ground pictures are missing
  const t = document.createElement('canvas'); t.width = t.height = 400;
  const g = t.getContext('2d'); g.scale(2, 2); g.fillStyle = C.ground; g.fillRect(0, 0, 200, 200);
  g.strokeStyle = 'rgba(255,244,220,.06)'; g.lineWidth = 1.5; g.beginPath();
  g.moveTo(0, 0.75); g.lineTo(200, 0.75); g.moveTo(0, 100); g.lineTo(200, 100);
  g.moveTo(0.75, 0); g.lineTo(0.75, 100); g.moveTo(100, 100); g.lineTo(100, 200); g.stroke();
  return t;
}

let ac = null, outGain = null, muted = false; const lastS = {};
function audioInit() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  try { const A = window.AudioContext || window.webkitAudioContext; ac = new A(); outGain = ac.createGain(); outGain.gain.value = 0.55; outGain.connect(ac.destination); }
  catch (e) { ac = null; }
}
function tone(f, dur, type, vol, slide, delay) {
  if (!ac || muted) return;
  const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(outGain); o.start(t); o.stop(t + dur + 0.03);
}
const thr = (k, ms) => { const n = performance.now(); if (n - (lastS[k] || 0) < ms) return false; lastS[k] = n; return true; };

  boing() { if (thr('b', 60)) tone(620, 0.06, 'sine', 0.05, 260); },
  ice()   { tone(1400, 0.25, 'sine', 0.06, -900); tone(1800, 0.18, 'triangle', 0.04, -1200, 0.03); },

/* ---------- spawning ---------- */
function spawnPos() {

  if (p < 2 * hw) return [G.px - hw + p, G.py + hh]; p -= 2 * hw;
  if (p < 2 * hh) return [G.px - hw, G.py - hh + p]; p -= 2 * hh;
  return [G.px + hw, G.py - hh + p];
}
function spawn(type, x, y) {
  const d = ENEMY[type], m = d.boss ? 1 : 1 + G.t / 60 * G.st.hpGrow * (d.elite ? 0.5 : 1);
  if (x === undefined) [x, y] = spawnPos();
  framesOf(d);
  const e = { id:EID++, d, x, y, r:d.r, hp:d.hp * m, maxHp:d.hp * m, spd:d.spd * (d.elite ? 1 : rnd(0.9, 1.1)), kx:0, ky:0, flash:0,
              ph:Math.random() * TAU, sh:0, bh:0, frz:0, still:false, dead:false, at:rnd(1, 2.5), mode:0, mt:rnd(0.5, 1.5), su:6, spin:0, ux:0, uy:0 };

}
function pickType() {   // a kind joins the mix at its first second and ramps to full weight over ~30 s

  const w = st.mix.map(([, t0, wt]) => { const v = t < t0 ? 0 : wt * Math.min(1, 0.3 + (t - t0) / 45); sum += v; return v; });
  let r = Math.random() * sum;

}

/* ---------- spatial grid ---------- */
const grid = new Map(); let gridKeys = [];
const gkey = (cx, cy) => ((cx & 0xffff) << 16) | (cy & 0xffff);
function buildGrid() {
  if (grid.size > 3000) { grid.clear(); gridKeys.length = 0; }
  for (const k of gridKeys) grid.get(k).length = 0;
  gridKeys.length = 0;
  for (const e of G.enemies) {
    const k = gkey(Math.floor(e.x / CELL), Math.floor(e.y / CELL));
    let a = grid.get(k); if (!a) { a = []; grid.set(k, a); }
    if (a.length === 0) gridKeys.push(k);
    a.push(e);
  }
}
function eachNear(x, y, fn) {
  const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  for (let ix = cx - 1; ix <= cx + 1; ix++) for (let iy = cy - 1; iy <= cy + 1; iy++) {
    const a = grid.get(gkey(ix, iy)); if (!a) continue;
    for (let j = 0; j < a.length; j++) if (fn(a[j]) === false) return;

}

function addText(x, y, str, kind) { G.texts.push({ x, y, str, kind, life:0.6 }); if (G.texts.length > 60) G.texts.shift(); }

}

function enemyShot(x, y, ux, uy, spd, dmg, k) { if (G.shots.length < 160) G.shots.push({ x, y, vx:ux * spd, vy:uy * spd, life:3, dmg, k, dead:false }); }
function nearest(n, R) {   // the n closest customers within R; bosses, then elites, count as much closer than they are
  const out = [], ds = [], R2 = R * R;
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = e.x - G.px, dy = e.y - G.py, raw = dx * dx + dy * dy;
    if (raw > R2) continue;

/* ---------- upgrades: picked for you, no pause ---------- */
function autoPick() {   // keep weapons growing, add new ones while a slot is free, feed rice when hurt

  for (const k in ITEMS) {

    let w = d.weapon ? (l ? 3 + l : free ? 2.2 : 0) : (l ? 2.2 : 1.6);
    if (k === 'rice' && G.hp < G.maxHp * 0.5) w += 5;
    if (k === 'chili' || k === 'straw') w += 0.6;
    if (w > 0) pool.push([k, w]);
  }
  if (!pool.length) return 'heal';
  let r = Math.random() * pool.reduce((s, p) => s + p[1], 0);
  for (const [k, w] of pool) if ((r -= w) < 0) return k;
  return pool[0][0];
}

  const d = ITEMS[k]; G.it[k]++; const l = G.it[k];
  if (k === 'rice') { G.maxHp += 40; G.hp = Math.min(G.maxHp, G.hp + 40); }

/* ---------- update ---------- */
function update(dt) {
  const g = G, st = g.st; g.t += dt; g.fk = 0;

  // movement
  let mx = 0, my = 0;
  if (dbgIn.on) { mx = dbgIn.x; my = dbgIn.y; }
  else {
    if (keys.has('arrowleft') || keys.has('a')) mx -= 1;
    if (keys.has('arrowright') || keys.has('d')) mx += 1;
    if (keys.has('arrowup') || keys.has('w')) my -= 1;
    if (keys.has('arrowdown') || keys.has('s')) my += 1;
    if (mx || my) { const m = Math.hypot(mx, my); mx /= m; my /= m; }
    else if (joy.on) {
      const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
      if (d > 6) { const k = Math.min(1, d / 44) / d; mx = dx * k; my = dy * k; }
    }
  }
  const sp = moveSpeed();
  g.px += mx * sp * dt; g.py += my * sp * dt;
  const mag = Math.hypot(mx, my);
  if (mag && !g.moving) g.ap = 0;   // start every run from the first footfall
  g.moving = mag > 0; if (Math.abs(mx) > 0.15) g.face = mx < 0 ? -1 : 1;
  g.ap += dt * 16 * mag * sp / 150;   // feet keep pace with how fast you actually move
  g.ip += dt * 6;
  if (g.inv > 0) g.inv -= dt;
  if (g.it.rice) g.hp = Math.min(g.maxHp, g.hp + 0.5 * g.it.rice * dt);
  const px = g.px, py = g.py;

  spawnTick(dt);

  // customers walk toward the vendor; some keep their distance, some charge, bosses throw rings of projectiles
  const dec = Math.max(0, 1 - 9 * dt), farR = Math.hypot(VW, VH) / 2 + 200, slowR = g.it.tofu >= 3 ? tofuR() : 0;
  for (const e of g.enemies) {
    const dd = e.d, dx = px - e.x, dy = py - e.y, d = Math.hypot(dx, dy) || 1;
    if (e.flash > 0) e.flash -= dt;
    if (e.frz > 0) { e.frz -= dt; e.still = true; e.x += e.kx * dt; e.y += e.ky * dt; e.kx *= dec; e.ky *= dec; continue; }   // frozen: no moving, no biting
    if (d > farR) { [e.x, e.y] = spawnPos(); e.mode = 0; continue; }   // left behind: walk back in from the edge, so running away is not a strategy
    let s = e.spd, ux = dx / d, uy = dy / d;
    if (dd.ranged) {
      if (d < 180) { ux = -ux; uy = -uy; s *= 0.6; } else if (d < 250) s = 0;
      e.at -= dt;
      if (e.at <= 0) { e.at = rnd(2.4, 3.2); if (d < 380) { enemyShot(e.x, e.y - 18, dx / d, dy / d, dd.ranged === 'dart' ? 230 : 175, dd.dmg, dd.ranged); sfx.throw(); } }
    }
    if (dd.dash) {
      e.mt -= dt;
      if (e.mode === 0) { if (e.mt <= 0 && d < 260) { e.mode = 1; e.mt = 0.75; e.ux = ux; e.uy = uy; } }
      else if (e.mode === 1) { s = 0; if (e.mt <= 0) { e.mode = 2; e.mt = 0.55; } }
      else { s = dd.boss ? 300 : 340; ux = e.ux; uy = e.uy; if (e.mt <= 0) { e.mode = 0; e.mt = dd.boss ? 4 : 2.4; } }
    }
    if (dd.burst) {
      const [n, every, spd, k] = dd.burst;
      e.at -= dt; e.su -= dt;
      if (e.at <= 0) { e.at = every; e.spin += 0.3; for (let i = 0; i < n; i++) { const a = e.spin + i / n * TAU; enemyShot(e.x, e.y - dd.ht * 0.35, Math.cos(a), Math.sin(a), spd, 12, k); } sfx.throw(); }
      if (e.su <= 0) { e.su = 9; for (let i = 0; i < 5; i++) { const a = i / 5 * TAU; spawn(st.mix[0][0], e.x + Math.cos(a) * 70, e.y + Math.sin(a) * 70); } }
    }
    if (slowR && d < slowR + e.r) s *= 0.65;
    e.still = s === 0;
    const k = s * dt;
    e.x += ux * k + e.kx * dt; e.y += uy * k + e.ky * dt;
    e.kx *= dec; e.ky *= dec;
    const min = e.r + 11;
    if (d < min) { if (g.inv <= 0 && !g.dead) hurtPlayer(dd.dmg); const p = (min - d) / d; e.x -= dx * p; e.y -= dy * p; }
  }
  buildGrid();
  for (const e of g.enemies) {
    eachNear(e.x, e.y, o => {

}

  const xf = Math.round(G.xp / G.need * 100);
  if (hudCache.xp !== xf) { hudCache.xp = xf; el.xp.style.transform = 'scaleX(' + xf / 100 + ')'; }
  const low = G.hp / G.maxHp < 0.3 ? 0.3 + (reduce ? 0 : 0.14 * Math.sin(G.t * 6)) : 0;
  const hv = Math.round(Math.max(G.hurt, low, 0) * 20) / 20;
  if (hudCache.h !== hv) { hudCache.h = hv; el.hurt.style.opacity = hv; }
  G.st.quests.forEach((q, i) => {
    const row = el.quests.children[i + 1], done = G.qdone[i];
    const v = done ? '✓' : q.k === 'boss' ? (G.bossOn ? '0/1' : '最後出現') : q.k === 'money' ? nt(Math.min(G.money, q.n)) : Math.min(questVal(q), q.n) + '/' + q.n;
    setTxt(row.lastChild, 'q' + i, v);
    if (hudCache['qd' + i] !== done) { hudCache['qd' + i] = done; row.classList.toggle('done', done); }
  });
  const boss = G.boss && !G.boss.dead ? G.boss : null;
  if (el.bossbar.hidden === !!boss) el.bossbar.hidden = !boss;
  if (boss) { const f = Math.round(clamp(boss.hp / boss.maxHp, 0, 1) * 200) / 200; if (hudCache.b !== f) { hudCache.b = f; el.bossfill.style.transform = 'scaleX(' + f + ')'; } }
}
function buildQuests() {
  el.quests.textContent = '';
  const h = document.createElement('li'); h.className = 'qh'; h.textContent = G.st.name + '任務'; el.quests.appendChild(h);
  for (const q of G.st.quests) {
    const li = document.createElement('li'), s = document.createElement('span'), b = document.createElement('b');
    s.textContent = questText(q); li.append(s, b); el.quests.appendChild(li);
  }
}
function updateBuild() {
  el.build.textContent = '';
  for (const k in ITEMS) {
    const l = G.it[k]; if (!l) continue;
    const s = document.createElement('span');
    if (ART[ITEMS[k].icon]) s.appendChild(iconImg(ITEMS[k].icon));
    s.append(ITEMS[k].name + ' ' + (l >= ITEMS[k].max ? '滿' : l)); el.build.appendChild(s);
  }
}
let toastT = 0;
function toast(msg) { el.toast.textContent = msg; el.toast.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.toast.hidden = true; }, 2600); }
const banner = { q:[], until:0 };
function pushBanner(icon, title, desc) { banner.q.push([icon, title, desc]); if (banner.q.length > 4) banner.q.shift(); }
function bannerTick(now) {
  if (now < banner.until) return;
  if (!banner.q.length) { if (!el.banner.hidden) el.banner.hidden = true; return; }
  const [icon, title, desc] = banner.q.shift();
  el.bIcon.hidden = !ART[icon]; if (ART[icon]) el.bIcon.src = ART[icon].src;
  el.bName.textContent = title; el.bDesc.textContent = desc;
  el.banner.hidden = false; el.banner.classList.remove('show'); void el.banner.offsetWidth; el.banner.classList.add('show');
  banner.until = now + 2200;
}
function setState(s) {
  state = s;
  el.cover.hidden = s !== 'cover'; el.start.hidden = s !== 'menu'; el.level.hidden = s !== 'levelup'; el.pause.hidden = s !== 'paused';
  el.end.hidden = !(s === 'over' || s === 'win'); el.hud.hidden = s === 'menu' || s === 'cover';
  if (s !== 'play' && s !== 'levelup') { el.toast.hidden = true; el.banner.hidden = true; }
  if (s === 'menu' || s === 'cover' || s === 'over' || s === 'win') el.bossbar.hidden = true;
  dirty = true;
}

function card(stampNode, title, desc, tag, onPick) {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'card';
  const st = document.createElement('span'); st.className = 'stamp'; st.setAttribute('aria-hidden', 'true'); st.append(stampNode);
  const tx = document.createElement('span'); tx.className = 'ctext';
  const nm = document.createElement('strong'); nm.textContent = title;
  const ds = document.createElement('span'); ds.textContent = desc; tx.append(nm, ds);
  const tg = document.createElement('span'); tg.className = 'tag'; tg.textContent = tag;
  b.append(st, tx, tg); b.addEventListener('click', onPick);
  return b;
}
const stampOf = d => ART[d.icon] ? iconImg(d.icon) : d.name[0];
const span = (cls, text) => { const s = document.createElement('span'); s.className = cls; if (text) s.textContent = text; return s; };
function renderStages() {   // one signboard per street: its picture, the headline customer, the vendor's tool, progress
  el.stageCards.textContent = '';
  STAGES.forEach((st, i) => {
    const open = i < save.unlock, star = ENEMY[st.boss || st.elite[0]], tool = ITEMS[st.tool];
    const b = document.createElement('button'); b.type = 'button'; b.className = 'stage'; b.disabled = !open;
    b.style.setProperty('--thumb', 'url("assets/stage' + (i + 1) + '.jpg")');
    b.setAttribute('aria-label', st.name + ' ' + st.place + (open ? '' : '（未解鎖）'));
    const art = span('sart'); art.append(span('snum', String(i + 1)));
    const face = ART[star.key];
    if (face) { const f = span('sface'); f.style.backgroundImage = 'url("' + face.src + '")'; f.style.aspectRatio = (face.width / 4) + ' / ' + face.height; art.append(f); }
    art.append(span('sbadge' + (save.clear[i] ? ' done' : ''), !open ? '未解鎖' : save.clear[i] ? '已收攤' : '挑戰'));
    const info = span('sinfo'), nm = document.createElement('strong'); nm.textContent = st.name + '　' + st.place;
    const meta = span('smeta');
    if (ART[tool.icon]) meta.append(iconImg(tool.icon));
    meta.append('主角帶：' + tool.name + (save.clear[i] ? '　最快 ' + fmt(save.best[i]) : ''));
    info.append(nm, span('sdesc', open ? st.desc : '先過' + STAGES[i - 1].name + '才能玩'), meta);
    b.append(art, info); b.addEventListener('click', () => startRun(i));
    el.stageCards.appendChild(b);
  });
  el.btnMode.textContent = save.manual ? '升級：自己選' : '升級：自動挑';
  el.btnMode.setAttribute('aria-pressed', String(save.manual));
}

function rollChoices() {   // only used when the player turns on "choose upgrades myself"
  const free = owned() < SLOTS;
  const pool = Object.keys(ITEMS).filter(k => G.it[k] < ITEMS[k].max && (!ITEMS[k].weapon || G.it[k] > 0 || free));
  for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const out = pool.slice(0, 3);
  const fresh = pool.filter(k => ITEMS[k].weapon && G.it[k] === 0);
  if (fresh.length && out.length === 3 && !out.some(k => fresh.includes(k)) && Math.random() < 0.5) out[2] = fresh[0];
  if (out.length < 3) out.push('heal');
  return out;
}
function renderCards() {
  el.lvTitle.textContent = '升到 Lv ' + (G.lvl - G.pending) + '！選一樣';
  el.cards.textContent = '';
  choices.forEach((k, i) => {
    let c;
    if (k === 'heal') c = card(stampOf(HEAL), HEAL.name, HEAL.desc(), '補血', () => pick(i));
    else { const it = ITEMS[k], l = G.it[k] + 1; c = card(stampOf(it), it.name, it.desc(l), l === 1 ? (it.weapon ? '新武器' : '新道具') : 'Lv ' + l + '/' + it.max, () => pick(i)); }
    c.id = 'card' + i; el.cards.appendChild(c);
  });
}
function openLevelUp() {
  G.pending--; choices = rollChoices(); renderCards(); lvOpenAt = performance.now();
  setState('levelup'); sfx.level();
}
function pick(i, force) {
  if (state !== 'levelup' || choices[i] === undefined) return;
  if (!force && performance.now() - lvOpenAt < 300) return;   // guard against a tap that was meant for steering
  applyChoice(choices[i]); sfx.pick(); updateBuild();
  if (G.pending > 0) openLevelUp(); else { levelBurst(); setState('play'); last = performance.now(); }
}
function startRun(si) {
  audioInit(); newGame(si); for (const k in hudCache) delete hudCache[k];
  heroOf(si); for (const [k] of G.st.mix) framesOf(ENEMY[k]); framesOf(ENEMY[G.st.elite[0]]);   // cut the animation frames now, not mid-fight
  joy.on = false; keys.clear(); banner.q.length = 0; banner.until = 0;
  buildQuests(); updateBuild(); hudUpdate(); setState('play'); last = performance.now();
  toast(G.st.name + '「' + G.st.place + '」開張！今天帶' + ITEMS[G.st.tool].name);
}
function endRun(win) {
  const i = G.si, st = G.st, t = G.t, next = win && i + 1 < STAGES.length ? i + 1 : -1, first = win && !save.clear[i];
  const isBest = win && (!save.best[i] || t < save.best[i]);
  if (win) { save.clear[i] = true; if (isBest) save.best[i] = t; if (next > 0) save.unlock = Math.max(save.unlock, next + 1); writeSave(); }
  el.endTitle.textContent = win ? '任務完成，收攤！' : '被吃垮了';
  el.endMsg.textContent = win
    ? (next > 0 ? (first ? STAGES[next].name + '「' + STAGES[next].place + '」解鎖了！主角會改帶' + ITEMS[STAGES[next].tool].name + '。' : '要繼續挑戰' + STAGES[next].name + '嗎？') : '五關全破，你就是夜市之王！')
    : '完成了 ' + G.qdone.filter(Boolean).length + '/' + st.quests.length + ' 個任務。換個走位再試一次。';
  el.eTime.textContent = fmt(t); el.eKills.textContent = G.kills; el.eMoney.textContent = wan(G.money);
  el.eBest.textContent = win ? (isBest ? '最快收攤新紀錄！' : '這關最快 ' + fmt(save.best[i])) : '';
  el.eBest.hidden = !win;
  goTo = next > 0 ? next : i;
  el.btnGo.textContent = next > 0 ? '前往' + STAGES[next].name : '再擺一次';
  el.btnAgain.hidden = !(next > 0);
  hudUpdate(); setState(win ? 'win' : 'over');
  if (win) sfx.win(); else sfx.lose();
}
function toMenu() { renderStages(); setState('menu'); }
function togglePause() {
  if (state === 'play') setState('paused');
  else if (state === 'paused') { setState('play'); last = performance.now(); }
}
function setMuted(m) {
  muted = m;
  document.querySelectorAll('.snd').forEach(b => { b.textContent = m ? '音效：關' : '音效：開'; b.setAttribute('aria-pressed', String(!m)); });
}
function loadSave(data) {
  let s = null;
  try { s = JSON.parse(localStorage.getItem('nm.save') || 'null'); } catch (e) {}
  for (const src of [s, data && data.save]) {
    if (!src) continue;
    save.unlock = Math.max(save.unlock, Math.min(STAGES.length, src.unlock | 0));
    STAGES.forEach((_, i) => {
      const b = +(src.best && src.best[i]) || 0;
      if (b && (!save.best[i] || b < save.best[i])) save.best[i] = b;
      save.clear[i] = save.clear[i] || !!(src.clear && src.clear[i]);
    });
    if (typeof src.manual === 'boolean') save.manual = src.manual;
  }
}
function writeSave() { try { localStorage.setItem('nm.save', JSON.stringify(save)); } catch (e) {} }

/* ---------- input ---------- */
const local = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
cv.addEventListener('pointerdown', e => {
  if (state !== 'play') return;
  audioInit(); joy.on = true; joy.id = e.pointerId; [joy.ox, joy.oy] = local(e); joy.x = joy.ox; joy.y = joy.oy;
  try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  if (!joy.on || e.pointerId !== joy.id) return;
  [joy.x, joy.y] = local(e);
  const dx = joy.x - joy.ox, dy = joy.y - joy.oy, d = Math.hypot(dx, dy);
  if (d > 64) { joy.ox += dx / d * (d - 64); joy.oy += dy / d * (d - 64); }   // the base follows the finger
});
const joyEnd = e => { if (e.pointerId === joy.id) joy.on = false; };
cv.addEventListener('pointerup', joyEnd); cv.addEventListener('pointercancel', joyEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
const MOVE = ['arrowleft', 'arrowright', 'arrowup', 'arrowdown', 'w', 'a', 's', 'd'];
const leaveCover = () => { if (state === 'cover' && ready) { audioInit(); toMenu(); } };
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (MOVE.includes(k)) { if (state === 'play') { keys.add(k); e.preventDefault(); } return; }
  if (e.repeat) return;
  if (state === 'cover' && (k === 'enter' || k === ' ')) { leaveCover(); e.preventDefault(); }
  else if (k === 'p' || k === 'escape') togglePause();
  else if (state === 'levelup' && (k === '1' || k === '2' || k === '3')) pick(+k - 1);
});
window.addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
window.addEventListener('blur', () => { keys.clear(); joy.on = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') setState('paused'); });
el.cover.addEventListener('click', leaveCover);
$('btnGo').addEventListener('click', () => startRun(goTo));
$('btnAgain').addEventListener('click', () => startRun(G.si));
$('btnMenu').addEventListener('click', toMenu);
$('btnMenu2').addEventListener('click', toMenu);
$('btnRestart').addEventListener('click', () => startRun(G.si));
$('btnResume').addEventListener('click', togglePause);
$('btnPause').addEventListener('click', togglePause);
el.btnMode.addEventListener('click', () => { save.manual = !save.manual; writeSave(); renderStages(); });
document.querySelectorAll('.snd').forEach(b => b.addEventListener('click', () => { audioInit(); setMuted(!muted); }));

/* ---------- boot ---------- */
function resize() {
  const r = gameEl.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height); DPR = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  S = clamp(Math.min(W, H) / 430, 0.75, 1.5); VW = W / S; VH = H / S; dirty = true;
}
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); render(); hudUpdate(); bannerTick(now); }
  else if (dirty) { render(); dirty = false; }
}
function boot(data) {
  loadSave(data); buildSprites(); resize(); newGame(0); setState('cover');
  if (window.ResizeObserver) new ResizeObserver(resize).observe(gameEl); else window.addEventListener('resize', resize);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { dirty = true; });
  loadArt(p => { el.loadfill.style.transform = 'scaleX(' + p + ')'; }).then(() => {
    buildSprites(); dirty = true; ready = true;
    el.btnCover.disabled = false; el.btnCover.textContent = '點一下開始';
  });
  last = performance.now(); requestAnimationFrame(frame);
}
// small handle for automated playtests
window.__nm = { get g() { return G; }, get state() { return state; }, start:i => startRun(i || 0), step:update,
  draw:() => { render(); hudUpdate(); }, pick, input:dbgIn, save, art:ART, stages:STAGES };

const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ save })); } catch (e) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
})();
</script>
